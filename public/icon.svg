<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b026ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#000000" opacity="0.8"/>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="80" stroke="url(#grad1)" stroke-width="3" fill="none" filter="url(#glow)"/>
  
  <!-- Drone Body -->
  <ellipse cx="100" cy="100" rx="30" ry="20" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Propeller Arms -->
  <line x1="100" y1="100" x2="70" y2="70" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="100" x2="130" y2="70" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="100" x2="70" y2="130" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="100" x2="130" y2="130" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Propellers -->
  <circle cx="70" cy="70" r="15" stroke="url(#grad1)" stroke-width="2" fill="#000000" filter="url(#glow)"/>
  <circle cx="130" cy="70" r="15" stroke="url(#grad1)" stroke-width="2" fill="#000000" filter="url(#glow)"/>
  <circle cx="70" cy="130" r="15" stroke="url(#grad1)" stroke-width="2" fill="#000000" filter="url(#glow)"/>
  <circle cx="130" cy="130" r="15" stroke="url(#grad1)" stroke-width="2" fill="#000000" filter="url(#glow)"/>
  
  <!-- Propeller Blades -->
  <line x1="60" y1="70" x2="80" y2="70" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="70" x2="140" y2="70" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="130" x2="80" y2="130" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="140" y2="130" stroke="#00f3ff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center LED -->
  <circle cx="100" cy="100" r="8" fill="#00ff88" filter="url(#glow)"/>
  
  <!-- Crosshair -->
  <line x1="100" y1="40" x2="100" y2="60" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="140" x2="100" y2="160" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="40" y1="100" x2="60" y2="100" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="140" y1="100" x2="160" y2="100" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
